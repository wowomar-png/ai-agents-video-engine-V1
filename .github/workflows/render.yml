name: Render car lesson
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/lesson.json'
      - 'package.json'
      - '.github/workflows/render.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run render:all
      - uses: actions/upload-artifact@v4
        with:
          name: car-learning-videos
          path: out/*.mp4
          retention-days: 7
